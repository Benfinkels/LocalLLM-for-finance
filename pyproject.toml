[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "when-not-to-llm"
version = "0.1.0"
description = "Empirical FinOps & accuracy benchmark comparing Deterministic Code, Local SLMs, Workstation MoE, Cloud APIs, and Hybrid pipelines."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
charts = ["matplotlib>=3.8", "numpy>=1.24"]
dev = ["pytest>=7.4", "matplotlib>=3.8", "numpy>=1.24"]

[project.scripts]
when-not-to-llm = "when_not_to_llm.runner:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
